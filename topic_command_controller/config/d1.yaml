# controller_manager config for the SDK sim bridge (d1, Mujoco)
/**:
  controller_manager:
    ros__parameters:
      update_rate: 400  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      topic_command_controller:
        type: topic_command_controller/TopicCommandController

  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 400  # Hz
      sensor_name: trunk_imu
      frame_id: trunk_imu

  joint_state_broadcaster:
    ros__parameters:
      update_rate: 400  # Hz

  topic_command_controller:
    ros__parameters:
      joints:
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FL_foot_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - FR_foot_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
        - RL_foot_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint
        - RR_foot_joint
