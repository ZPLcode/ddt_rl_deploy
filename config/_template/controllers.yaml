# controllers.yaml — copy to config/<robot>/ and edit for your robot. See README.
# All per-joint lists have length N = joint count. Values below are for a 16-DoF
# wheel-legged quadruped (4 legs x hip/thigh/calf/wheel).
/**:
  controller_manager:
    ros__parameters:
      update_rate: 400  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      robot_rl_controller:
        type: rl_controller/RlController

  imu_sensor_broadcaster:
    ros__parameters:
      sensor_name: trunk_imu
      frame_id: trunk_imu

  joint_state_broadcaster:
    ros__parameters:
      # actuated joints, in the training / MJCF actuator order
      joints: &joints
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FL_foot_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - FR_foot_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
        - RL_foot_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint
        - RR_foot_joint

  robot_rl_controller:
    ros__parameters:
      joints: *joints

      command_interfaces: [position, velocity, effort, kp, kd]
      state_interfaces:   [position, velocity, effort]
      sensors:            [trunk_imu]

      torque_limit: [80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0]
      wheel_indices: [3, 7, 11, 15]      # 0-based; [] if fully legged
      hip_indices:   [0, 4, 8, 12]

      rl_policy_names:
        - "rl_policy"

      # one block per name in rl_policy_names; values come from your training run
      rl_policy:
        policy_path: config/<robot>/policy.onnx
        output_name: "nn_output"
        control_type: "P_V"      # P_V: legs position + wheels velocity; P: position
        num_actions: 16
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]  # each must exist in _OBS_SPECS (policy_engine.py)
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        max_commands: [1.0, 1.0, 1.0]
        min_commands: [-1.0, -1.0, -1.0]
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0]
        joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
        action_scales: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]
        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05
