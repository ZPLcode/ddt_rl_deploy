# Single D1 deployment config shared by rl_inference and every simulator.
# Keep controller-manager and policy parameters here so joint ordering has one
# source of truth. ONNX models live next to this file.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      joint_command_controller:
        type: topic_command_controller/TopicCommandController
  
  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 500  # Hz
      sensor_name: trunk_imu
      frame_id: trunk_imu

  joint_command_controller:
    ros__parameters:
      command_interfaces: [position, velocity, effort, kp, kd]
      # Hold a stable stand while the simulator is running without a policy.
      # The first command/joint_command message replaces all of these targets.
      startup_hold: true
      startup_positions: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
      startup_kp: [100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0]
      startup_kd: [4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5]
      joints:
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FL_foot_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - FR_foot_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
        - RL_foot_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint
        - RR_foot_joint

  rl_inference_node:
    ros__parameters:
      # Robot-wide limits and joint groups used by the external Python runtime.
      torque_limit: [80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0, 80.0, 80.0, 80.0, 20.0]
      wheel_indices: [3, 7, 11, 15]
      hip_indices: [0, 4, 8, 12]

      joint_pd:
        joint_kp: [100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0]
        joint_kd: [4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5]
      rl_policy_names:
        - rl_flat
        - rl_flat_lab
        - rl_rough_lab
        - rl_moe_cts

      rl_flat:
        policy_path: flat.onnx
        output_name: "nn_output"
        # env
        num_obs: 57
        num_actions: 16
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25] # lin_vel_scale, lin_vel_scale, ang_vel_scale
        max_commands: [3.0, 1.0, 1.0]
        min_commands: [-3.0, -1.0, -1.0]
        # control parameters
        default_joint_angles: [0.1, 0.8, -1.5, 0.0, -0.1, 0.8, -1.5, 0.0, 0.1, 1.0, -1.5, 0.0, -0.1, 1.0, -1.5, 0.0]
        joint_kp: [100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0, 100.0, 60.0, 60.0, 10.0]
        joint_kd: [4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5, 4.0, 1.5, 1.5, 0.5]

        action_scales: [ 0.125, 0.25, 0.25, 0.25, 0.125, 0.25, 0.25, 0.25, 0.125, 0.25, 0.25, 0.25, 0.125, 0.25, 0.25, 0.25 ]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

      rl_flat_lab:
        policy_path: flat_lab.onnx
        output_name: "nn_output"
        # env
        num_obs: 57
        num_actions: 16
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        max_commands: [1.0, 1.0, 1.0]
        min_commands: [-1.0, -1.0, -1.0]
        # control parameters
        control_type: "P_V"
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0]
        joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
        action_scales: [ 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0 ]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

      rl_rough_lab:
        policy_path: rough_lab.onnx
        output_name: "nn_output"
        # env
        num_obs: 57
        num_actions: 16
        history_len: 10
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        max_commands: [1.0, 1.0, 1.0]
        min_commands: [-1.0, -1.0, -1.0]
        # control parameters
        control_type: "P_V"
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, -0.0, 0.8, -1.5, 0.0]
        joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
        action_scales: [ 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0 ]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

      rl_moe_cts:
        policy_path: d1_moe_cts.onnx
        policy_type: cts_moe
        output_name: actions
        num_obs: 58
        num_actions: 16
        history_len: 10
        control_dt: 0.02
        observations_name: [ang_vel, gravity, velocity_commands, height_commands, dof_pos, dof_vel, last_actions]
        commands_name: [lin_vel_x, lin_vel_y, ang_vel_z, base_height]
        commands_scale: [2.0, 2.0, 0.25, 1.0]
        commands_gain: [1.0, 1.0, 1.0, 1.0]
        min_commands: [-1.0, -1.0, -1.0, 0.2]
        max_commands: [1.2, 1.0, 1.0, 0.5]
        initial_height: 0.35
        control_type: P_V
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
        joint_kp: [55.0, 55.0, 55.0, 0.0, 55.0, 55.0, 55.0, 0.0, 55.0, 55.0, 55.0, 0.0, 55.0, 55.0, 55.0, 0.0]
        joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
        action_scales: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05
